audio:
  sr: 16000
  max_sec: 4.0
  n_fft: 1024
  hop: 256
  n_mels: 80
  trim_db: 30

augment:            # csak tanitaskor, a cache-elt mel-spektrogramon (train.py --augment)
  noise_db_min: -70 # zajpadlo szintje dB-ben, a fajl maximumahoz kepest (0 dB = max, -80 = padlo)
  noise_db_max: -45 # Run 2-ben -50..-20 volt: tul eros, a spektrogram nagy reszet elfedte
  n_freq_masks: 2   # ennyi veletlen frekvenciasavot nullazunk
  freq_mask_max: 8  # max savszelesseg mel-sorban
  n_time_masks: 2   # ennyi veletlen idoszakaszt nullazunk
  time_mask_max: 20 # max hossz oszlopban (20 oszlop = 0.32 s)

data:
  root: data/LA
